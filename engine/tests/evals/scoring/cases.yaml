# Labelled scoring eval cases. Everything here is SYNTHETIC: invented people, invented
# companies, invented postings. Do not paste real job descriptions or real profiles.
#
# Bands (see harness.band_for): strong >= 80, borderline 60-79, poor < 60.
# dealbreakers: requirements the JD states as mandatory. Each has a `keyword` (matched,
# normalised, against the model's dealbreaker requirement/jd_quote text in live mode) and the
# verbatim `jd_quote` (must occur in the JD; the offline test enforces that).

